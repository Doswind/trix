[package]
name = "trix"
version = "0.6.0"
edition = "2021"
rust-version = "1.70"
description = "Fast, low-footprint sci-fi ASCII terminal effects: 12 animated scenes from code rain to black holes"
license = "MIT"
readme = "README.md"
keywords = ["terminal", "ascii", "animation", "fire", "matrix"]
categories = ["command-line-utilities", "graphics"]

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
