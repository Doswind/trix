[package]
name = "trix-effects"
version = "0.11.0"
edition = "2021"
rust-version = "1.70"
description = "35 animated ASCII/Unicode effects for the terminal in one fast, dependency-free Rust binary"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Doswind/trix-effects"
homepage = "https://github.com/Doswind/trix-effects"
documentation = "https://docs.rs/trix-effects"
keywords = ["terminal", "ascii-art", "animation", "tui", "effects"]
categories = ["command-line-utilities", "graphics"]

[lib]
name = "trix_effects"
path = "src/lib.rs"

[[bin]]
name = "trix"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
