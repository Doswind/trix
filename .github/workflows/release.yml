name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "10.15"

jobs:
  macos:
    name: macOS universal
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal
      - name: Build arm64 and x86_64
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package universal binary
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="dev"; fi
          mkdir -p pkg dist
          lipo -create \
            target/aarch64-apple-darwin/release/trix \
            target/x86_64-apple-darwin/release/trix \
            -output pkg/trix
          chmod +x pkg/trix
          cp README.md README.zh-CN.md LICENSE CHANGELOG.md CHANGELOG.zh-CN.md pkg/
          tar -czf "dist/trix-effects-${VERSION}-macos-universal.tar.gz" -C pkg .
          file pkg/trix
          ./pkg/trix --version
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x86_64 (static)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Test
        run: cargo test --locked
      - name: Build static musl binary
        run: cross build --release --locked --target x86_64-unknown-linux-musl
      - name: Package static binary
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="dev"; fi
          mkdir -p pkg dist
          cp target/x86_64-unknown-linux-musl/release/trix pkg/trix
          chmod +x pkg/trix
          cp README.md README.zh-CN.md LICENSE CHANGELOG.md CHANGELOG.zh-CN.md pkg/
          tar -czf "dist/trix-effects-${VERSION}-linux-x86_64.tar.gz" -C pkg .
          file pkg/trix
          ./pkg/trix --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

  linux-arm64:
    name: Linux ARM64 (static)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-aarch64
      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Build static ARM64 binary
        run: cross build --release --locked --target aarch64-unknown-linux-musl
      - name: Package static ARM64 binary
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="dev"; fi
          mkdir -p pkg dist
          cp target/aarch64-unknown-linux-musl/release/trix pkg/trix
          chmod +x pkg/trix
          cp README.md README.zh-CN.md LICENSE CHANGELOG.md CHANGELOG.zh-CN.md pkg/
          tar -czf "dist/trix-effects-${VERSION}-linux-aarch64.tar.gz" -C pkg .
          file pkg/trix
      - name: Smoke test under QEMU
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
          qemu-aarch64-static ./pkg/trix --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, linux-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          # A tag with a pre-release suffix (v0.11.1-beta.1) must never become
          # the "Latest" release or replace the stable documentation link.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
